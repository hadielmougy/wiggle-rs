[package]
name = "wiggle-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust client and worker for the Wiggle durable workflow engine"
license = "Apache-2.0"
repository = "https://github.com/hadielmougy/wiggle-rs"
readme = "README.md"

[lib]
name = "wiggle"

[dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
env_logger = "0.11"
